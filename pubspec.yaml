name: garba_app
description: A modern Garba Learning & Event Booking Application
version: 1.0.0+1
publish_to: 'none'
environment:
  sdk: ^3.8.0
  flutter: ">=3.10.0"
dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.12.0
  # State Management
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  hooks_riverpod: ^2.4.9
  flutter_hooks: ^0.20.4
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.1
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.1.0
  pin_code_fields: ^8.0.1
  image_picker: ^1.0.7
  # QR Code
  qr_flutter: ^4.1.0
  # Navigation
  go_router: ^12.1.3
  # Camera
  camera: ^0.10.5+9
  # Animations
  lottie: ^3.1.2
  flutter_animate: ^4.3.0
  # Utils
  intl: ^0.18.1
  uuid: ^4.2.2
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
cloud_firestore: ^6.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.11.1
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
